name: Uptime

# Polls /api/health and fails the run when the site does not answer 200,
# which makes GitHub send its usual "workflow failed" notification (#225).
#
# ## Read this before trusting it
#
# This is the free, zero-dependency option, not the good one. Its limits
# are real and worth knowing before it is the only thing watching:
#
#  - **`schedule` is best-effort, and much later than it says.** Measured
#    over a day of real runs, the gaps were 55, 50, 96 and 70 minutes for a
#    cron that asks for 15. The real resolution is about an hour, so a
#    40-minute outage can pass unseen. Shortening the interval does not
#    help — GitHub delays it anyway.
#  - **It disables itself after 60 days without repository activity.** If
#    development pauses, the monitor stops — silently, and precisely when
#    nobody is around to notice the site is down either.
#  - **Alerting is email on a failed run**, with no escalation and no
#    acknowledgement.
#
# An external monitor (UptimeRobot, Better Stack — both free at this scale)
# has none of those problems and points at the same endpoint. This workflow
# is what makes the check exist today; it is not an argument against
# setting one up. See `docs/operations.md`.

on:
  schedule:
    # Every 15 minutes. Not 5: GitHub's own guidance is that frequent cron
    # schedules on a busy runner pool get delayed anyway, so a shorter
    # interval buys resolution it cannot actually deliver, and burns runs.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Never let two checks overlap, and never cancel one in flight — a probe
# killed halfway would report a failure that says nothing about the site.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe /api/health
        env:
          # Required, with no default on purpose. The production domain
          # lives in `NEXT_PUBLIC_SITE_URL` on Vercel and nowhere in this
          # repository, so any hardcoded fallback here would be a guess —
          # and a monitor guessing its target is worse than no monitor: it
          # reports green about a host nobody asked it to watch.
          #
          # Set it once with:
          #   gh variable set HEALTHCHECK_URL --body "https://<domain>/api/health"
          HEALTH_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          set -uo pipefail

          if [ -z "${HEALTH_URL:-}" ]; then
            echo "::error::HEALTHCHECK_URL is not set. Run: gh variable set HEALTHCHECK_URL --body \"https://<domain>/api/health\""
            exit 1
          fi

          # No `.json`: the extension would be a lie in the one case that
          # matters. A failing probe gets whatever the host felt like
          # returning — an HTML error page, a proxy notice, a login.
          BODY=/tmp/health-body
          PREVIEW_BYTES=200

          # Print the start of the body, on one line, capped.
          #
          # It used to `cat` the whole thing. That was written for the
          # healthy answer, which is 40 characters of JSON — but the failure
          # path is exactly where the response is something else. A 404 from
          # Next is ~4KB of HTML with every Turbopack chunk in it, printed
          # twice, and it buried the line that actually says what happened.
          # A probe exists for when things do not answer what you expect, so
          # its logging cannot assume they did.
          preview_body() {
            [ -s "$BODY" ] || return 0
            printf '  body: '
            head -c "$PREVIEW_BYTES" "$BODY" | tr -d '\r' | tr '\n' ' '
            [ "$(wc -c < "$BODY")" -gt "$PREVIEW_BYTES" ] && printf ' …[truncated]'
            printf '\n'
          }

          # Two attempts before declaring an outage. One failed request from
          # a GitHub runner is as likely to be the runner's network as the
          # site's, and a monitor that cries wolf gets muted — after which
          # it is worth nothing on the day it is right.
          for attempt in 1 2; do
            # Deliberately NOT --location. A redirect is a failure here: the
            # endpoint must answer directly. Following one would mask a
            # misrouted probe — which is not hypothetical, the i18n proxy
            # was redirecting /api/health to /es/api/health when this was
            # written, and --location would have hidden where that went.
            code=$(curl --silent --show-error \
                        --max-time 20 \
                        --output "$BODY" \
                        --write-out '%{http_code}' \
                        "$HEALTH_URL") && rc=0 || rc=$?

            if [ "$rc" -eq 0 ] && [ "$code" = "200" ]; then
              echo "Attempt $attempt: HTTP $code"
              # Capped here too: a 200 is not proof the body is ours. A
              # misconfigured URL pointing at some other page answers 200
              # with a full document.
              preview_body
              exit 0
            fi

            echo "Attempt $attempt failed: curl exit $rc, HTTP ${code:-none}"
            preview_body

            if [ "$attempt" -eq 1 ]; then
              sleep 30
            fi
          done

          echo "::error::$HEALTH_URL did not answer 200 on two attempts."
          exit 1
