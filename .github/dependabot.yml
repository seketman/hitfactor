# Dependabot — actualizaciones automáticas de dependencias.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Estrategia para mantenedor único:
#  - Agrupamos updates en pocas PRs (en vez de una PR por paquete que
#    sería abrumador) para que revisar dependencias sea una tarea
#    puntual de 10min en lugar de 50 PRs sueltas.
#  - Solo patch/minor automático — los majors pueden ser breaking, los
#    revisamos a mano cuando toque.
#  - npm y GitHub Actions mensual: los micro-bumps semanales generaban mucho
#    ruido (y cada regeneración del lockfile podía romper el `npm ci` del CI,
#    ver override de `@swc/helpers` en package.json). Mensual + agrupado deja
#    una sola tanda de revisión por mes.
#
# Nota: las "Dependabot security updates" (alertas críticas de CVE) son
# automáticas y van por canal aparte — siempre se abren incluso para
# majors si la vuln lo amerita.
#
# One exception, added later: an `ignore` entry filters the security channel
# too, not only version updates. The npm block below ignores eslint majors and
# therefore does carry that gap - see the comment there for why it is accepted.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    # `update-types` under `groups` below only decides what gets bundled into a
    # shared PR - it does not stop a major from being proposed. Whatever matches
    # no group still opens its own PR, which is how eslint 10 arrived and broke
    # `npm run lint` in CI: eslint-plugin-react, pulled in transitively by
    # eslint-config-next, does not support eslint 10 yet.
    #
    # Scoped to eslint rather than a blanket "*" on purpose: `ignore` applies to
    # security updates as well as version updates and has no `applies-to` key to
    # narrow it, so a blanket major-ignore would also swallow a CVE fix whose
    # only patched release is a new major. eslint is dev-only and eslint 10 is
    # unusable here regardless, so this one entry stays cheap. It covers
    # `eslint` alone - a major of eslint-config-next or eslint-plugin-react is
    # unaffected and could break CI the same way.
    #
    # Remove once eslint-config-next ships an eslint 10 compatible
    # eslint-plugin-react.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "github-actions"
